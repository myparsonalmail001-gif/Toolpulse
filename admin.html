<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Toolpulse</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f4f6f9; 
            padding: 20px; 
            color: #333;
        }
        .container { 
            max-width: 900px; 
            margin: 20px auto; 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); 
        }
        h2, h3 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
        
        /* Stats Grid Layout */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .stat-card.green {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
        }
        .stat-card.orange {
            background: linear-gradient(135deg, #f57c00, #e65100);
        }
        .stat-card h4 { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
        .stat-card .number { font-size: 28px; font-weight: bold; }

        /* Form & Inputs */
        .login-box { max-width: 450px; margin: 50px auto; }
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            margin-bottom: 30px;
        }
        input, textarea, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 14px;
        }
        textarea { resize: vertical; height: 80px; }
        button { 
            background: #1a73e8; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s ease;
        }
        button:hover { background: #1557b0; }
        #admin-content { display: none; }

        /* Tools List Styling */
        .tool-card { 
            border: 1px solid #e0e0e0; 
            padding: 15px; 
            margin-top: 12px; 
            border-radius: 6px; 
            background: #ffffff; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .tool-info { max-width: 80%; }
        .tool-info strong { font-size: 16px; color: #222; }
        .tool-info small { color: #666; word-break: break-all; }
        .delete-btn { 
            width: auto; 
            padding: 8px 14px; 
            background: #dc3545; 
            margin: 0; 
            font-size: 13px;
        }
        .delete-btn:hover { background: #bd2130; }
        .logout-btn { background: #6c757d; margin-top: 30px; }
        .logout-btn:hover { background: #5a6268; }
    </style>
</head>
<body>

<!-- লগইন সেকশন -->
<div class="container login-box" id="login-box">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login to Dashboard</button>
</div>

<!-- মূল ড্যাশবোর্ড -->
<div class="container" id="admin-content">
    <h2>Toolpulse Overview Dashboard</h2>
    
    <!-- ড্যাশবোর্ড ট্র্যাকিং ও স্ট্যাটস -->
    <div class="stats-grid">
        <div class="stat-card">
            <h4>TOTAL ACTIVE TOOLS</h4>
            <div class="number" id="total-tools-count">0</div>
        </div>
        <div class="stat-card green">
            <h4>SERVER STATUS</h4>
            <div class="number">Active (200 OK)</div>
        </div>
        <div class="stat-card orange">
            <h4>DATABASE CONNECTION</h4>
            <div class="number">Firestore Online</div>
        </div>
    </div>

    <!-- নতুন টুলস যোগ করার ফর্ম -->
    <div class="form-section">
        <h3>নতুন টুল যুক্ত করুন</h3>
        <input type="text" id="tool-name" placeholder="টুলের নাম (যেমন: Image Resizer)">
        <input type="text" id="tool-link" placeholder="টুলের লিংক (যেমন: /tools/resizer.html)">
        <textarea id="tool-desc" placeholder="টুলের সংক্ষিপ্ত বিবরণ"></textarea>
        <button onclick="addTool()">Add Tool</button>
    </div>

    <h3>বর্তমান সকল টুলস</h3>
    <div id="tools-list">লোডিং হচ্ছে...</div>

    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<!-- Firebase SDK Integration -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAv0hl6l5bFHGK_aN2Ap_7iPGnnQftNPN8",
    authDomain: "toolpulse-admin.firebaseapp.com",
    projectId: "toolpulse-admin",
    storageBucket: "toolpulse-admin.firebasestorage.app",
    messagingSenderId: "420891454976",
    appId: "1:420891454976:web:367097596e4ee7ec3572e5",
    measurementId: "G-0WEYMXY55F"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Login
  window.login = function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!email || !password) {
      alert("অনুগ্রহ করে ইমেইল এবং পাসওয়ার্ড দিন।");
      return;
    }

    signInWithEmailAndPassword(auth, email, password)
      .then(() => alert("Login Successful!"))
      .catch(error => alert("Error: " + error.message));
  };

  // Logout
  window.logout = function() {
    signOut(auth).then(() => alert("Logged out successfully!"));
  };

  // Auth State Listener
  onAuthStateChanged(auth, user => {
    if (user) {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
      loadTools();
    } else {
      document.getElementById('login-box').style.display = 'block';
      document.getElementById('admin-content').style.display = 'none';
    }
  });

  // Add Tool Function
  window.addTool = async function() {
    const name = document.getElementById('tool-name').value;
    const link = document.getElementById('tool-link').value;
    const desc = document.getElementById('tool-desc').value;

    if (!name || !link) {
      alert("অনুগ্রহ করে টুলের নাম এবং লিংক পূরণ করুন।");
      return;
    }

    try {
      await addDoc(collection(db, "tools"), {
        name: name,
        link: link,
        desc: desc,
        createdAt: new Date()
      });

      document.getElementById('tool-name').value = '';
      document.getElementById('tool-link').value = '';
      document.getElementById('tool-desc').value = '';

      alert("টুল সফলভাবে যুক্ত হয়েছে!");
      loadTools();
    } catch (error) {
      alert("Error adding tool: " + error.message);
    }
  };

  // Fetch Tools and Update Active Tools Count
  async function loadTools() {
    const listContainer = document.getElementById('tools-list');
    const countElement = document.getElementById('total-tools-count');
    listContainer.innerHTML = 'লোডিং হচ্ছে...';

    try {
      const querySnapshot = await getDocs(collection(db, "tools"));
      listContainer.innerHTML = '';
      
      // Update count automatically
      countElement.textContent = querySnapshot.size;

      if (querySnapshot.empty) {
        listContainer.innerHTML = '<p style="text-align:center; color:#777;">কোনো টুল পাওয়া যায়নি।</p>';
        return;
      }

      querySnapshot.forEach(docSnap => {
        const data = docSnap.data();
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `
          <div class="tool-info">
            <strong>${data.name}</strong><br>
            <small><a href="${data.link}" target="_blank">${data.link}</a></small>
            <p style="margin-top: 4px; color: #555; font-size: 13px;">${data.desc || ''}</p>
          </div>
          <button class="delete-btn" onclick="deleteTool('${docSnap.id}')">Delete</button>
        `;
        listContainer.appendChild(card);
      });
    } catch (error) {
      listContainer.innerHTML = '<p style="color:red; text-align:center;">ত্রুটি: টুল লোড করা যাচ্ছে না।</p>';
      console.error("Error loading tools: ", error);
    }
  }

  // Delete Tool Function
  window.deleteTool = async function(id) {
    if (confirm("আপনি কি নিশ্চিত যে এই টুলটি মুছে ফেলতে চান?")) {
      try {
        await deleteDoc(doc(db, "tools", id));
        alert("টুল মুছে ফেলা হয়েছে!");
        loadTools();
      } catch (error) {
        alert("Error deleting tool: " + error.message);
      }
    }
  };
</script>
</body>
</html>
