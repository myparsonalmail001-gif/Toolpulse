<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Pulse - Utility & File Tools</title>

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PDF, QR & Conversion Libraries -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        .bg-theme-gradient { 
            background: linear-gradient(135deg, #06b6d4 0%, #10b981 100%); 
        }
        .btn-gradient { 
            background: linear-gradient(135deg, #0284c7 0%, #059669 100%); 
        }
        .btn-gradient:hover { 
            background: linear-gradient(135deg, #0369a1 0%, #047857 100%); 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation with Tools & Live Counter -->
    <header class="bg-theme-gradient text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- Brand & Top Horizontal Bar -->
            <div class="flex items-center space-x-2 overflow-x-auto whitespace-nowrap pr-4 text-xs md:text-sm font-medium no-scrollbar">
                <a href="#" class="text-lg font-extrabold mr-3 flex items-center gap-1 text-white">
                    <i class="fa-solid fa-bolt text-yellow-300"></i> Tool Pulse
                </a>
                <button type="button" onclick="switchTool('pdf-jpg')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">PDF to JPG</button>
                <button type="button" onclick="switchTool('jpg-pdf')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">JPG to PDF</button>
                <button type="button" onclick="switchTool('pdf-word')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">PDF to Word</button>
                <button type="button" onclick="switchTool('word-pdf')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">Word to PDF</button>
                <button type="button" onclick="switchTool('word-excel')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">Word to Excel</button>
                <button type="button" onclick="switchTool('merge-pdf')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">Merger PDF</button>
                <button type="button" onclick="switchTool('resizer')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">Image Resizer</button>
                <button type="button" onclick="switchTool('url-short')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">URL Shortener</button>
                <button type="button" onclick="switchTool('qr-gen')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">QR Code</button>
                <button type="button" onclick="switchTool('resize-kb')" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-full transition">10 to 100 KB</button>
            </div>

            <!-- Live Visitor Counter & Dropdown -->
            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center gap-1.5 bg-black/20 text-white px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-sm">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    Live Visitors: <span id="visitorCount" class="text-yellow-300 font-bold">10,248</span>
                </div>

                <button id="menuBtn" onclick="document.getElementById('dropdownMenu').classList.toggle('hidden')" class="text-white text-2xl px-2 focus:outline-none">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Dropdown Menu -->
    <div id="dropdownMenu" class="hidden bg-white border-b shadow-lg px-6 py-4 grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
        <button type="button" onclick="switchTool('pdf-jpg')" class="text-left text-cyan-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-file-pdf"></i> PDF to JPG</button>
        <button type="button" onclick="switchTool('jpg-pdf')" class="text-left text-emerald-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-file-image"></i> JPG to PDF</button>
        <button type="button" onclick="switchTool('pdf-word')" class="text-left text-cyan-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-file-word"></i> PDF to Word</button>
        <button type="button" onclick="switchTool('word-pdf')" class="text-left text-emerald-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-file-lines"></i> Word to PDF</button>
        <button type="button" onclick="switchTool('word-excel')" class="text-left text-cyan-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-file-excel"></i> Word to Excel</button>
        <button type="button" onclick="switchTool('merge-pdf')" class="text-left text-emerald-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-code-merge"></i> Merger PDF</button>
        <button type="button" onclick="switchTool('resizer')" class="text-left text-cyan-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-crop-simple"></i> Image Resizer (300x300)</button>
        <button type="button" onclick="switchTool('url-short')" class="text-left text-emerald-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-link"></i> URL Shortener</button>
        <button type="button" onclick="switchTool('qr-gen')" class="text-left text-cyan-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-qrcode"></i> QR Code Generator</button>
        <button type="button" onclick="switchTool('resize-kb')" class="text-left text-emerald-700 font-semibold hover:underline flex items-center gap-2"><i class="fa-solid fa-compress"></i> 10 to 100 KB Compressor</button>
    </div>

    <!-- Main Workspace -->
    <div class="container mx-auto p-4 flex-grow grid grid-cols-1 md:grid-cols-4 gap-4">
        
        <!-- Sidebar Ads (Left side - 2 Ads) -->
        <aside class="md:col-span-1 space-y-4">
            <!-- Ad Space 1 -->
            <div class="bg-slate-200 border-2 border-dashed border-slate-300 rounded-xl h-48 flex items-center justify-center text-slate-400 font-bold text-sm">
                Ad Space 1 (Sidebar Top)
            </div>
            <!-- Ad Space 2 -->
            <div class="bg-slate-200 border-2 border-dashed border-slate-300 rounded-xl h-64 flex items-center justify-center text-slate-400 font-bold text-sm">
                Ad Space 2 (Sidebar Bottom)
            </div>
        </aside>

        <!-- Dynamic Work Area -->
        <main class="md:col-span-3 bg-white border border-slate-200 shadow-sm rounded-2xl p-6 flex flex-col items-center justify-between min-h-[460px]">
            
            <h1 id="toolTitle" class="text-xl md:text-2xl font-bold text-cyan-800 border-b-2 border-emerald-400 pb-2 mb-4 w-full text-center">
                PDF Merger Tool
            </h1>

            <div id="workBox" class="w-full flex-grow flex flex-col items-center justify-center p-6 my-2 border-2 border-dashed border-cyan-300 bg-cyan-50/40 rounded-xl text-center">
                <div class="w-20 h-20 bg-theme-gradient text-white rounded-full flex items-center justify-center text-3xl shadow-md mb-3">
                    <i id="workBoxIcon" class="fa-solid fa-code-merge"></i>
                </div>
                
                <p id="workBoxText" class="text-slate-600 font-medium mb-4">একাধিক PDF ফাইল নির্বাচন করুন</p>
                
                <!-- Dynamic Input Container -->
                <div id="inputContainer" class="w-full max-w-md">
                    <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
                    <button id="selectBtn" type="button" onclick="document.getElementById('fileInput').click()" class="bg-cyan-600 hover:bg-cyan-700 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition shadow-md">
                        Choose File
                    </button>
                </div>

                <div id="statusMessage" class="mt-3 text-xs font-semibold text-emerald-600 hidden"></div>
                <div id="previewArea" class="mt-4 hidden w-full flex flex-col items-center justify-center text-sm text-slate-700"></div>
                <div id="qrContainer" class="mt-4 flex flex-col items-center"></div>
            </div>

            <!-- Action Button -->
            <button id="mainActionBtn" type="button" onclick="processCurrentTool()" class="w-full md:w-2/3 btn-gradient text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition text-base md:text-lg flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-download"></i> Merge & Download PDF
            </button>

            <!-- Bottom Horizontal Ad (Ad Space 3 - Slim Banner) -->
            <div class="w-full mt-6 bg-slate-200 border-2 border-dashed border-slate-300 rounded-xl h-20 flex items-center justify-center text-slate-400 font-bold text-sm">
                Ad Space 3 (Bottom Horizontal Banner)
            </div>

        </main>
    </div>

    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        let currentTool = 'merge-pdf';
        let selectedFiles = [];

        // 10,000+ Live Visitor Counter Simulation
        let count = parseInt(localStorage.getItem('visitor_count')) || 10248;
        function updateVisitorCount() {
            document.getElementById('visitorCount').innerText = count.toLocaleString('en-US');
            localStorage.setItem('visitor_count', count);
        }
        setInterval(() => {
            count += Math.floor(Math.random() * 3) + 1;
            updateVisitorCount();
        }, 4000);

        // Switch Tools
        function switchTool(toolKey) {
            currentTool = toolKey;
            selectedFiles = [];
            
            const titleEl = document.getElementById('toolTitle');
            const iconEl = document.getElementById('workBoxIcon');
            const textEl = document.getElementById('workBoxText');
            const inputContainer = document.getElementById('inputContainer');
            const actionBtn = document.getElementById('mainActionBtn');
            const previewArea = document.getElementById('previewArea');
            const statusMsg = document.getElementById('statusMessage');
            const qrContainer = document.getElementById('qrContainer');

            previewArea.classList.add('hidden');
            statusMsg.classList.add('hidden');
            previewArea.innerHTML = '';
            qrContainer.innerHTML = '';

            if (toolKey === 'url-short') {
                titleEl.innerText = "URL Shortener";
                iconEl.className = "fa-solid fa-link";
                textEl.innerText = "আপনার দীর্ঘ লিঙ্কটি নিচে লিখুন";
                inputContainer.innerHTML = `
                    <input type="url" id="textInput" placeholder="https://example.com/very-long-url" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 text-sm">
                `;
                actionBtn.innerHTML = `<i class="fa-solid fa-link"></i> Shorten URL`;
            } else if (toolKey === 'qr-gen') {
                titleEl.innerText = "QR Code Generator";
                iconEl.className = "fa-solid fa-qrcode";
                textEl.innerText = "টেক্সট বা লিঙ্ক দিয়ে QR Code তৈরি করুন";
                inputContainer.innerHTML = `
                    <input type="text" id="textInput" placeholder="আপনার লিঙ্ক বা লেখা লিখুন..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                `;
                actionBtn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Generate QR Code`;
            } else {
                inputContainer.innerHTML = `
                    <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(event)">
                    <button id="selectBtn" type="button" onclick="document.getElementById('fileInput').click()" class="bg-cyan-600 hover:bg-cyan-700 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition shadow-md">
                        Choose File
                    </button>
                `;
                const fileInput = document.getElementById('fileInput');
                const selectBtn = document.getElementById('selectBtn');

                switch(toolKey) {
                    case 'pdf-jpg':
                        titleEl.innerText = "PDF to JPG Converter";
                        iconEl.className = "fa-solid fa-file-pdf";
                        textEl.innerText = "আপনার PDF ফাইল নির্বাচন করুন";
                        selectBtn.innerText = "Choose PDF File";
                        actionBtn.innerHTML = `<i class="fa-solid fa-download"></i> Convert & Download JPG`;
                        fileInput.setAttribute('accept', 'application/pdf');
                        fileInput.removeAttribute('multiple');
                        break;
                    case 'jpg-pdf':
                        titleEl.innerText = "JPG to PDF Converter";
                        iconEl.className = "fa-solid fa-file-image";
                        textEl.innerText = "ছবি নির্বাচন করুন (PDF বানানোর জন্য)";
                        selectBtn.innerText = "Choose Image Files";
                        actionBtn.innerHTML = `<i class="fa-solid fa-download"></i> Convert & Download PDF`;
                        fileInput.setAttribute('accept', 'image/*');
                        fileInput.setAttribute('multiple', 'true');
                        break;
                    case 'pdf-word':
                        titleEl.innerText = "PDF to Word Converter";
                        iconEl.className = "fa-solid fa-file-word";
                        textEl.innerText = "PDF ফাইল সিলেক্ট করুন (Docx এ রূপান্তর করতে)";
                        selectBtn.innerText = "Choose PDF File";
                        actionBtn.innerHTML = `<i class="fa-solid fa-download"></i> Convert & Download Word`;
                        fileInput.setAttribute('accept', 'application/pdf');
                        fileInput.removeAttribute('multiple');
                        break;
                    case 'word-pdf':
                        titleEl.innerText = "Word to PDF Converter";
                        iconEl.className = "fa-solid fa-file-lines";
                        textEl.innerText = "Word ফাইল (.docx) সিলেক্ট করুন (PDF এ রূপান্তর করতে)";
                        selectBtn.innerText = "Choose Word File";
                        actionBtn.innerHTML = `<i class="fa-solid fa-download"></i> Convert & Download PDF`;
                        fileInput.setAttribute('accept', '.docx');
                        fileInput.removeAttribute('multiple');
                        break;
                    case 'word-excel':
                        titleEl.innerText = "Word to Excel Converter";
                        iconEl.className = "fa-solid fa-file-excel";
                        textEl.innerText = "Word ফাইল (.docx) সিলেক্ট করুন (Excel এ রূপান্তর করতে)";
                        selectBtn.innerText = "Choose Word File";
                        actionBtn.innerHTML = `<i class="fa-solid fa-download"></i> Convert & Download Excel`;
                        fileInput.setAttribute('accept', '.docx');
                        fileInput.removeAttribute('multiple');
                        break;
                    case 'merge-pdf':
                        titleEl.innerText = "PDF Merger Tool";
                        iconEl.className = "fa-solid fa-code-merge";
                        textEl.innerText = "একাধিক PDF ফাইল নির্বাচন করুন (জোড়া দেওয়ার জন্য)";
                        selectBtn.innerText = "Choose PDF Files";
                        actionBtn.innerHTML = `<i class="fa-solid fa-download"></i> Merge & Download PDF`;
                        fileInput.setAttribute('accept', 'application/pdf');
                        fileInput.setAttribute('multiple', 'true');
                        break;
                    case 'resizer':
                        titleEl.innerText = "Image Resizer (300x300)";
                        iconEl.className = "fa-solid fa-crop-simple";
                        textEl.innerText = "ছবি সিলেক্ট করুন (৩০০x৩০০ করার জন্য)";
                        selectBtn.innerText = "Choose Image File";
                        actionBtn.innerHTML = `<i class="fa-solid fa-download"></i> Resize & Download`;
                        fileInput.setAttribute('accept', 'image/*');
                        fileInput.removeAttribute('multiple');
                        break;
                    case 'resize-kb':
                        titleEl.innerText = "PDF & Image Compressor (10KB to 100KB)";
                        iconEl.className = "fa-solid fa-compress";
                        textEl.innerText = "আপনার PDF বা ছবি নির্বাচন করুন (১০-১০০ KB করার জন্য)";
                        selectBtn.innerText = "Choose File";
                        actionBtn.innerHTML = `<i class="fa-solid fa-download"></i> Compress & Download`;
                        fileInput.setAttribute('accept', 'application/pdf, image/*');
                        fileInput.removeAttribute('multiple');
                        break;
                }
            }
            document.getElementById('dropdownMenu').classList.add('hidden');
        }

        // Handle File Selection
        function handleFileSelect(event) {
            selectedFiles = Array.from(event.target.files);
            const previewArea = document.getElementById('previewArea');
            if (selectedFiles.length === 0) return;

            previewArea.classList.remove('hidden');
            if (currentTool === 'merge-pdf' || currentTool === 'jpg-pdf') {
                let listHTML = '<strong>নির্বাচিত ফাইলসমূহ:</strong><ol class="list-decimal text-left pl-5 mt-2 space-y-1">';
                selectedFiles.forEach(f => {
                    listHTML += `<li>${f.name} <span class="text-xs text-slate-500">(${(f.size / 1024).toFixed(1)} KB)</span></li>`;
                });
                listHTML += '</ol>';
                previewArea.innerHTML = listHTML;
            } else {
                const file = selectedFiles[0];
                previewArea.innerHTML = `
                    <div class="bg-cyan-50 border border-cyan-200 p-3 rounded-lg text-center">
                        <p class="font-semibold text-slate-700">ফাইল: ${file.name}</p>
                        <p class="text-xs text-slate-500 mt-1">বর্তমান সাইজ: <span class="font-bold text-cyan-600">${(file.size / 1024).toFixed(1)} KB</span></p>
                    </div>
                `;
            }
        }

        // Master Router Function
        async function processCurrentTool() {
            if (currentTool === 'url-short') {
                executeURLShortener();
            } else if (currentTool === 'qr-gen') {
                executeQRGenerator();
            } else {
                if (selectedFiles.length === 0) {
                    alert("দয়া করে ফাইল নির্বাচন করুন!");
                    return;
                }

                switch(currentTool) {
                    case 'pdf-jpg':
                        await executePDFToJPG(selectedFiles[0]);
                        break;
                    case 'jpg-pdf':
                        await executeJPGToPDF();
                        break;
                    case 'pdf-word':
                        await executePDFToWord(selectedFiles[0]);
                        break;
                    case 'word-pdf':
                        await executeWordToPDF(selectedFiles[0]);
                        break;
                    case 'word-excel':
                        await executeWordToExcel(selectedFiles[0]);
                        break;
                    case 'merge-pdf':
                        await executePDFMerge();
                        break;
                    case 'resizer':
                        executeImageResizer300(selectedFiles[0]);
                        break;
                    case 'resize-kb':
                        const file = selectedFiles[0];
                        if (file.type === "application/pdf") {
                            await executePDFCompress(file);
                        } else if (file.type.startsWith("image/")) {
                            await executeImageCompress(file);
                        }
                        break;
                }
            }
        }

        // PDF to Word Conversion
        async function executePDFToWord(file) {
            showStatus("PDF থেকে টেক্সট বের করে Word এ রূপান্তর করা হচ্ছে...");
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const pageText = content.items.map(item => item.str).join(" ");
                    fullText += `--- Page ${i} ---\n` + pageText + "\n\n";
                }

                const blob = new Blob([fullText], { type: "application/msword;charset=utf-8" });
                downloadBlob(await blob.arrayBuffer(), `${file.name.split('.')[0]}.docx`, "application/msword");
                showStatus("Word (.docx) ফাইল প্রস্তুত!", true);
            } catch (e) {
                console.error(e);
                alert("PDF to Word করতে সমস্যা হয়েছে।");
            }
        }

        // Word to PDF Conversion
        async function executeWordToPDF(file) {
            showStatus("Word ফাইলকে PDF এ কনভার্ট করা হচ্ছে...");
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                const splitText = doc.splitTextToSize(result.value, 180);
                doc.text(splitText, 10, 10);
                
                doc.save(`${file.name.split('.')[0]}.pdf`);
                showStatus("PDF ফাইল প্রস্তুত!", true);
            } catch (e) {
                console.error(e);
                alert("Word to PDF কনভার্ট করতে সমস্যা হয়েছে।");
            }
        }

        // Word to Excel Conversion
        async function executeWordToExcel(file) {
            showStatus("Word ফাইল থেকে এক্সেল তৈরি করা হচ্ছে...");
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                
                const lines = result.value.split('\n').filter(line => line.trim() !== '');
                const excelData = lines.map(line => [line]);

                const worksheet = XLSX.utils.aoa_to_sheet(excelData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");

                XLSX.writeFile(workbook, `${file.name.split('.')[0]}.xlsx`);
                showStatus("Excel (.xlsx) ফাইল তৈরি সম্পূর্ণ!", true);
            } catch (e) {
                console.error(e);
                alert("Word to Excel করতে সমস্যা হয়েছে।");
            }
        }

        // Helper Functions
        async function executePDFToJPG(file) {
            showStatus("PDF কে JPG এ কনভার্ট করা হচ্ছে...");
            try {
                const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.download = `${file.name.split('.')[0]}_page1.jpg`;
                link.click();
                showStatus("JPG ডাউনলোড সম্পন্ন!", true);
            } catch(e) { alert("সমস্যা হয়েছে!"); }
        }

        async function executeJPGToPDF() {
            showStatus("ছবিসমূহকে PDF এ কনভার্ট করা হচ্ছে...");
            const { jsPDF } = window.jspdf;
            let doc = new jsPDF();
            for (let i = 0; i < selectedFiles.length; i++) {
                const dataUrl = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = e => r(e.target.result);
                    reader.readAsDataURL(selectedFiles[i]);
                });
                if (i > 0) doc.addPage();
                doc.addImage(dataUrl, 'JPEG', 10, 10, 190, 0);
            }
            doc.save("Converted.pdf");
            showStatus("PDF তৈরি সম্পন্ন!", true);
        }

        async function executePDFMerge() {
            if (selectedFiles.length < 2) return alert("অন্তত ২টি ফাইল দরকার!");
            showStatus("PDF জোড়া দেওয়া হচ্ছে...");
            const { PDFDocument } = PDFLib;
            const mergedPdf = await PDFDocument.create();
            for (let f of selectedFiles) {
                const pdf = await PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption: true });
                const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                pages.forEach(p => mergedPdf.addPage(p));
            }
            downloadBlob(await mergedPdf.save(), "Merged.pdf", "application/pdf");
            showStatus("PDF Merge সম্পন্ন!", true);
        }

        function executeImageResizer300(file) {
            showStatus("রিসাইজ করা হচ্ছে...");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 300; canvas.height = 300;
                    canvas.getContext('2d').drawImage(img, 0, 0, 300, 300);
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/jpeg', 0.85);
                    link.download = `300x300_${file.name}`;
                    link.click();
                    showStatus("রিসাইজ ডাউনলোড হয়েছে!", true);
                }
            }
        }

        function executeURLShortener() {
            const inputVal = document.getElementById('textInput').value.trim();
            if (!inputVal) return alert("লিঙ্ক লিখুন!");
            showStatus("শর্ট লিঙ্ক তৈরি হচ্ছে...");
            fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(inputVal)}`)
                .then(res => res.text())
                .then(shortUrl => {
                    document.getElementById('previewArea').classList.remove('hidden');
                    document.getElementById('previewArea').innerHTML = `<a href="${shortUrl}" target="_blank" class="text-cyan-700 font-bold underline">${shortUrl}</a>`;
                    showStatus("শর্ট লিঙ্ক তৈরি সফল!", true);
                });
        }

        function executeQRGenerator() {
            const inputVal = document.getElementById('textInput').value.trim();
            if (!inputVal) return alert("লেখা বা লিঙ্ক দিন!");
            document.getElementById('qrContainer').innerHTML = '';
            new QRCode(document.getElementById('qrContainer'), { text: inputVal, width: 160, height: 160 });
            showStatus("QR Code তৈরি সম্পন্ন!", true);
        }

        async function executePDFCompress(file) {
            showStatus("PDF কমপ্রেস করা হচ্ছে...");
            try {
                const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                const { jsPDF } = window.jspdf;
                let doc = null;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 0.8 });
                    const canvas = document.createElement('canvas');
                    canvas.height = viewport.height; canvas.width = viewport.width;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                    const imgData = canvas.toDataURL('image/jpeg', 0.25);
                    if (i === 1) doc = new jsPDF('p', 'pt', [viewport.width, viewport.height]);
                    else doc.addPage([viewport.width, viewport.height], 'p');
                    doc.addImage(imgData, 'JPEG', 0, 0, viewport.width, viewport.height);
                }
                downloadBlob(await doc.output('blob').arrayBuffer(), `compressed_${file.name}`, "application/pdf");
                showStatus("PDF কমপ্রেস সম্পন্ন!", true);
            } catch(e) { alert("সমস্যা হয়েছে!"); }
        }

        async function executeImageCompress(file) {
            showStatus("ছবি কমপ্রেস করা হচ্ছে...");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width > 800 ? 800 : img.width;
                    canvas.height = (img.height * canvas.width) / img.width;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    const link = document.centerElement('a');
                    link.href = canvas.toDataURL('image/jpeg', 0.3);
                    link.download = `compressed_${file.name}`;
                    link.click();
                    showStatus("ছবি ডাউনলোড সম্পন্ন!", true);
                };
            };
        }

        function downloadBlob(data, filename, mimeType) {
            const blob = new Blob([data], { type: mimeType });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }

        function showStatus(msg, isSuccess = false) {
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.classList.remove('hidden');
            statusMsg.innerText = msg;
            statusMsg.className = isSuccess 
                ? "mt-3 text-xs font-semibold text-emerald-600 bg-emerald-50 p-2 rounded w-full border border-emerald-200"
                : "mt-3 text-xs font-semibold text-cyan-700 bg-cyan-50 p-2 rounded w-full border border-cyan-200";
        }

        window.onload = function() {
            updateVisitorCount();
            switchTool('merge-pdf');
        };
    </script>
</body>
